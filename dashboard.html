<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Área - Workshop VIP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 600px;
            margin: 50px auto;
            background: #0a192f;
            border: 1px solid #c5a059;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin: 20px 0;
            text-transform: uppercase;
        }
        .pending { background: rgba(255, 165, 0, 0.2); color: orange; border: 1px solid orange; }
        .approved { background: rgba(0, 184, 148, 0.2); color: #00b894; border: 1px solid #00b894; }
        
        .ticket-code {
            font-size: 2rem;
            color: #c5a059;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 20px 0;
            border: 2px dashed #c5a059;
            padding: 20px;
        }

        .btn-pay {
            background: #c5a059;
            color: #020c1b;
            padding: 15px 30px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-pay:hover { background: #e0bc75; }
        .hidden { display: none; }
    </style>
</head>
<body class="login-body">

    <div class="dashboard-container">
        <h1 id="user-name">Carregando...</h1>
        
        <div id="section-pending" class="hidden">
            <div class="status-badge pending">Aguardando Pagamento</div>
            <p style="color: #8892b0;">Você está quase lá! Garanta sua vaga agora.</p>
            <p style="font-size: 1.5rem; font-weight: bold;">R$ 99,00</p>
            <button onclick="pagarAgora()" class="btn-pay">PAGAR AGORA</button>
        </div>

        <div id="section-approved" class="hidden">
            <div class="status-badge approved">Ingresso Confirmado</div>
            <p style="color: #8892b0;">Apresente este código na portaria:</p>
            
            <div class="ticket-code" id="ticket-hash">...</div>
            
            <p style="font-size: 0.9rem; color: #8892b0;">E-mail de confirmação foi enviado à produção do evento.</p>
        </div>

        <div id="error-msg" style="color: #ff5f5f; margin-top: 20px;" class="hidden"></div>
    </div>

    <script>
        // Pega dados do localStorage (salvos no login)
        const email = localStorage.getItem('userEmail');
        const nome = localStorage.getItem('userName');

        if (!email) {
            window.location.href = 'login.html'; // Se não tiver logado, manda pro login
        } else {
            document.getElementById('user-name').innerText = `Olá, ${nome || 'Visitante'}!`;
            carregarStatus();
        }

        async function carregarStatus() {
            try {
                // Chama a rota que criei no server.js
                const res = await fetch(`/my-ticket?email=${email}`);
                
                if (!res.ok) throw new Error('Erro ao buscar dados');
                
                const user = await res.json();
                
                // Verifica o status do ticket
                const status = user.ticket ? user.ticket.status : 'pending';

                if (status === 'approved') {
                    document.getElementById('section-approved').classList.remove('hidden');
                    document.getElementById('ticket-hash').innerText = user.ticket.hash;
                } else {
                    document.getElementById('section-pending').classList.remove('hidden');
                }

            } catch (err) {
                console.error(err);
                const errorDiv = document.getElementById('error-msg');
                errorDiv.innerText = "Erro ao conectar com o servidor. Tente recarregar.";
                errorDiv.classList.remove('hidden');
            }
        }

        async function pagarAgora() {
            const btn = document.querySelector('.btn-pay');
            btn.innerText = "Processando...";
            btn.disabled = true;

            try {
                const res = await fetch('/process_payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if (data.init_point) window.location.href = data.init_point;
            } catch (err) {
                alert('Erro ao gerar pagamento.');
                btn.innerText = "PAGAR AGORA";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
