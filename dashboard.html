<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-container { max-width: 600px; margin: 80px auto; padding: 20px; color: white; }
        .status-card { background: #112240; padding: 40px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .ticket-approved { border: 2px solid #64ffda; background: rgba(100, 255, 218, 0.1); padding: 30px; border-radius: 12px; }
        .welcome-title { font-size: 2rem; color: var(--white); margin-bottom: 10px; }
        .welcome-sub { color: var(--text-dim); margin-bottom: 40px; }
        .btn-buy {
            background-color: #009ee3; color: white; font-weight: bold; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-buy:hover { background-color: #007eb5; transform: translateY(-2px); }
        .btn-refresh { background-color: #64ffda; color: #020c1b; }
        .btn-refresh:hover { background-color: #4cdbb3; }
    </style>
</head>
<body class="login-body">
    <div class="dash-container">
        <h1 id="welcome-msg" class="welcome-title">Olá!</h1>
        <p class="welcome-sub">Bem-vindo à sua área exclusiva.</p>
        <div id="content-area" class="status-card">
            <p style="color: var(--gold);">Carregando status...</p>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        document.getElementById('welcome-msg').innerText = `Olá, ${localStorage.getItem('userName') || 'Aluno'}!`;

        async function carregarDados() {
            try {
                const res = await fetch(`http://localhost:3000/me/${userId}`);
                const user = await res.json();
                const area = document.getElementById('content-area');

                if (user.ticket && user.ticket.status === 'approved') {
                    area.innerHTML = `
                        <div class="ticket-approved">
                            <h2 style="color: #64ffda; margin-top:0;">🎉 INGRESSO CONFIRMADO</h2>
                            <p style="color: #ccd6f6; margin-top: 20px;">Seu Código de Acesso:</p>
                            <h1 style="color: #fff; font-size: 4rem; margin: 10px 0; letter-spacing: 5px;">${user.ticket.hash}</h1>
                            <p style="color: #8892b0;">Data da compra: ${new Date(user.ticket.date).toLocaleDateString()}</p>
                            <p style="color: #64ffda; font-size: 0.9rem; margin-top: 20px;">Tire um print desta tela!</p>
                        </div>
                    `;
                } else {
                    area.innerHTML = `
                        <h2>Finalize sua Inscrição</h2>
                        <p style="color: var(--text-dim);">Garanta seu acesso ao Workshop VIP 2026.</p>
                        <br>
                        <div id="payment-box">
                            <h1 style="color: var(--gold); font-size: 3rem; margin: 20px 0;">R$ 149,00</h1>
                            <button onclick="comprarIngresso()" class="btn-buy" id="btn-pagar">💳 PAGAR COM MERCADO PAGO</button>
                            <p style="font-size: 0.8rem; color: #8892b0; margin-top: 15px;">Pix, Cartão de Crédito ou Boleto.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Erro ao carregar:", error);
                document.getElementById('content-area').innerHTML = "<p style='color:red'>Erro ao conectar com o servidor.</p>";
            }
        }

        async function comprarIngresso() {
            const btn = document.getElementById('btn-pagar');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Gerando Link...";
            btn.disabled = true;

            try {
                // ALTERADO O VALOR PARA 149.00
                const res = await fetch('http://localhost:3000/process_payment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, preco: 149.00 })
                });
                
                const data = await res.json();

                if (data.link) {
                    window.open(data.link, '_blank');
                    btn.innerHTML = "🔄 JÁ PAGUEI (ATUALIZAR)";
                    btn.classList.add('btn-refresh');
                    btn.disabled = false;
                    btn.onclick = function() { location.reload(); };
                } else {
                    alert("Erro ao gerar link de pagamento.");
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("Erro de conexão.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        }

        carregarDados();
    </script>
</body>
</html>
