<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Workshop VIP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-tabs { display: flex; justify-content: center; margin-bottom: 20px; }
        .auth-tab { cursor: pointer; padding: 10px 20px; color: #8892b0; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: #64ffda; border-bottom: 2px solid #64ffda; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="auth-tabs">
            <div id="tab-login" class="auth-tab active" onclick="switchTab('login')">Já tenho conta</div>
            <div id="tab-register" class="auth-tab" onclick="switchTab('register')">Registre-se</div>
        </div>

        <form id="form-login">
            <h2 style="text-align: center;">Bem-vindo de volta!</h2>
            <input type="email" id="login-email" placeholder="E-mail" required>
            <input type="password" id="login-pass" placeholder="Senha" required>
            <button type="submit" class="btn-login">ENTRAR</button>
        </form>

        <form id="form-register" class="hidden">
            <h2 style="text-align: center;">Crie sua conta</h2>
            <input type="text" id="reg-nome" placeholder="Nome Completo" required>
            <input type="email" id="reg-email" placeholder="E-mail" required>
            <input type="tel" id="reg-tel" placeholder="WhatsApp" required>
            <input type="password" id="reg-pass" placeholder="Senha (crie uma)" required>
            <button type="submit" class="btn-login">CADASTRAR E ENTRAR</button>
        </form>
    </div>

    <script>
        function switchTab(mode) {
            document.getElementById('form-login').classList.toggle('hidden', mode !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', mode !== 'register');
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        }

        async function handleAuth(url, data) {
            const res = await fetch(`http://localhost:3000${url}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            if (res.ok) {
                // SALVA OS DADOS NO NAVEGADOR
                localStorage.setItem('userId', result.userId);
                localStorage.setItem('userName', result.nome);
                localStorage.setItem('userEmail', result.email); // Salva o email para validar o admin

                // REDIRECIONAMENTO INTELIGENTE
                if (result.email === 'jlucas2140@gmail.com') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                alert(result.error || 'Erro ao processar');
            }
        }

        document.getElementById('form-login').onsubmit = (e) => {
            e.preventDefault();
            handleAuth('/login', {
                email: document.getElementById('login-email').value,
                senha: document.getElementById('login-pass').value
            });
        };

        document.getElementById('form-register').onsubmit = (e) => {
            e.preventDefault();
            handleAuth('/register', {
                nome: document.getElementById('reg-nome').value,
                email: document.getElementById('reg-email').value,
                telefone: document.getElementById('reg-tel').value,
                senha: document.getElementById('reg-pass').value
            });
        };
    </script>
</body>
</html>
